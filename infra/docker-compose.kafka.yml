# Stack compartilhado do Kafka — único event bus para todos os microserviços.
# Apache Kafka 4.2 em modo KRaft (sem Zookeeper) + Kafka UI para inspeção.
#
# Portas host:
#   kafka      : 19092 → broker (PLAINTEXT)  — 9092 default está ocupada por
#                funcionario-prometheus no host
#   kafka-ui   : 8090 → http://localhost:8090
#
# Os services (auth/funcionario/ferias/avaliacao/folha-pagamento) conectam via
# `host.docker.internal:19092` desde suas próprias networks Docker isoladas.
#
# Subir:    docker compose --project-directory . -f infra/docker-compose.kafka.yml up -d
# Derrubar: docker compose --project-directory . -f infra/docker-compose.kafka.yml down -v

name: hr-core-kafka

services:
  kafka:
    image: apache/kafka:4.2.1
    container_name: hr-core-kafka
    restart: unless-stopped
    ports:
      - '19092:19092'
    environment:
      # KRaft single-node setup. Listener PLAINTEXT_HOST é exposto pra host
      # via 19092 (9092 default está ocupada por funcionario-prometheus).
      # CONTROLLER e BROKER (PLAINTEXT) ficam internos via Docker DNS.
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://host.docker.internal:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # Auto-criar tópicos para dev
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # Single-node usa kafka-storage com cluster id estável
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - 'CMD-SHELL'
        - '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - hr-core-kafka

  kafka-init:
    image: apache/kafka:4.2.1
    container_name: hr-core-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hr-core-kafka
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        echo "Criando tópicos hr.*"
        for t in \
          hr.funcionario.criado \
          hr.funcionario.desligado \
          hr.funcionario.salario-alterado \
          hr.dependente.adicionado \
          hr.ferias.solicitadas \
          hr.ferias.aprovadas \
          hr.ferias.rejeitadas \
          hr.ferias.canceladas \
          hr.ferias.gozo-concluido \
          hr.folha.aberta \
          hr.folha.processada \
          hr.folha.aprovada \
          hr.folha.paga \
          hr.folha.fechada \
          hr.avaliacao.criada \
          hr.avaliacao.atualizada; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        echo "Tópicos criados."

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: hr-core-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8090:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: 'hr-core'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - hr-core-kafka

volumes:
  kafka-data:

networks:
  hr-core-kafka:
    name: hr-core-kafka
    driver: bridge
