# Stack local do Folha de Pagamento Service.
# Portas host isoladas (não colidem com nenhum outro stack):
#   folha-pagamento : 3004   →  3004 do container
#   mongo           : 27021  →  27017 do container
#   tempo HTTP      : 3214   →  3200
#   tempo OTLP      : 4332   →  4318
#   prometheus      : 9095   →  9090
#   grafana         : 3015   →  3000
#
# JWKS: aponta para o Auth Service real rodando no host
# (`pnpm --filter @hr-core/auth compose:up`) via host.docker.internal:4000.
#
# Subir tudo:    docker compose --project-directory . -f docker-compose.yml up -d --build
# Derrubar tudo: docker compose --project-directory . -f docker-compose.yml down -v

name: hr-core-folha-pagamento

services:
  folha-pagamento-service:
    build:
      context: ../..
      dockerfile: services/folha-pagamento/Dockerfile
    image: hr-core/folha-pagamento:local
    container_name: hr-core-folha-pagamento
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3004'
      LOG_LEVEL: info

      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: hr-folha-pagamento

      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:4000/.well-known/jwks.json}
      AUTH_JWT_ISSUER: https://auth.hr-core.local
      AUTH_JWT_AUDIENCE: hr-core

      SWAGGER_ENABLED: 'true'
      SWAGGER_ROUTE_PREFIX: /docs

      CORS_ORIGINS: 'http://localhost:3000,http://localhost:5173'
      CORS_CREDENTIALS: 'true'
      CORS_MAX_AGE: '86400'

      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: folha-pagamento
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

      # Kafka — broker compartilhado em infra/docker-compose.kafka.yml
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-host.docker.internal:19092}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      mongo:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - hr-folha-pagamento

  mongo:
    image: mongo:7
    container_name: hr-core-folha-pagamento-mongo
    restart: unless-stopped
    command: ['--bind_ip_all', '--quiet']
    ports:
      - '27021:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hr-folha-pagamento

  mongo-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: hr-core-folha-pagamento-mongo-exporter
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
      - '--compatible-mode'
      - '--web.listen-address=:9216'
    expose:
      - '9216'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hr-folha-pagamento

  tempo:
    image: grafana/tempo:3.0.0
    container_name: hr-core-folha-pagamento-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3214:3200'
      - '4332:4318'
    networks:
      - hr-folha-pagamento

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: hr-core-folha-pagamento-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2h'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9095:9090'
    networks:
      - hr-folha-pagamento
    depends_on:
      - folha-pagamento-service

  grafana:
    image: grafana/grafana:13.1.0
    container_name: hr-core-folha-pagamento-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: administrador
      GF_SECURITY_ADMIN_PASSWORD: 1qaz2wsx12
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3015:3000'
    networks:
      - hr-folha-pagamento
    depends_on:
      - prometheus
      - tempo

volumes:
  mongo-data:
  tempo-data:
  prometheus-data:
  grafana-data:

networks:
  hr-folha-pagamento:
    driver: bridge
