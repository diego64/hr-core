global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: hr-core-folha-pagamento-local

scrape_configs:
  - job_name: folha-pagamento
    metrics_path: /metrics
    static_configs:
      - targets: ['folha-pagamento-service:3004']
        labels:
          service: folha-pagamento
          env: local

  - job_name: mongo
    metrics_path: /metrics
    static_configs:
      - targets: ['mongo-exporter:9216']
        labels:
          service: mongo
          db: hr-folha-pagamento
          env: local
