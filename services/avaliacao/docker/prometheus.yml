global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: hr-core-avaliacao-local

scrape_configs:
  - job_name: avaliacao
    metrics_path: /metrics
    static_configs:
      - targets: ['avaliacao-service:3004']
        labels:
          service: avaliacao
          env: local

  - job_name: mongo
    metrics_path: /metrics
    static_configs:
      - targets: ['mongo-exporter:9216']
        labels:
          service: mongo
          db: hr-avaliacao
          env: local
