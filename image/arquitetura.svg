<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPub" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .lbl{font-size:13px;fill:#0f172a;font-weight:600}
      .sub{font-size:11px;fill:#475569}
      .tag{font-size:11px;fill:#ffffff;font-weight:600}
      .edge{stroke:#475569;stroke-width:1.6;fill:none}
      .edgePub{stroke:#7c3aed;stroke-width:1.6;fill:none}
      .edgeDash{stroke:#94a3b8;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .elbl{font-size:10px;fill:#7c3aed;font-weight:600}
      .dlbl{font-size:10px;fill:#64748b;font-weight:600}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#f8fafc"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#0f172a">HR Core — Arquitetura de Microserviços Orientada a Eventos</text>
  <text x="40" y="62" class="sub">Node.js + TypeScript · Fastify · MongoDB (1 por serviço) · Apache Kafka (KRaft) · JWT RS256 · Observabilidade Grafana/Loki/Tempo</text>

  <!-- Frontend -->
  <rect x="40" y="100" width="150" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="115" y="128" text-anchor="middle" class="lbl">Cliente</text>
  <text x="115" y="146" text-anchor="middle" class="sub">Frontend / SPA</text>

  <!-- API Gateway -->
  <rect x="250" y="92" width="230" height="78" rx="10" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="365" y="118" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">API Gateway  :3000</text>
  <text x="365" y="138" text-anchor="middle" fill="#dbeafe" font-size="10.5">JWT RS256 · Rate limit · Zod · Routing</text>
  <text x="365" y="153" text-anchor="middle" fill="#dbeafe" font-size="10.5">sem regra de negócio</text>

  <!-- Auth -->
  <rect x="560" y="92" width="220" height="78" rx="10" fill="#d97706" stroke="#b45309"/>
  <text x="670" y="118" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Auth Service  :4000</text>
  <text x="670" y="138" text-anchor="middle" fill="#fff7ed" font-size="10.5">RS256 · JWKS · refresh c/ rotação</text>
  <text x="670" y="153" text-anchor="middle" fill="#fff7ed" font-size="10.5">MongoDB hr-auth</text>

  <!-- frontend -> gateway -->
  <path class="edge" d="M190,130 L246,130" marker-end="url(#arrow)"/>
  <!-- gateway -> auth (JWKS) -->
  <path class="edgeDash" d="M480,118 L556,118" marker-end="url(#arrow)"/>
  <text x="518" y="110" text-anchor="middle" class="dlbl">JWKS</text>

  <!-- Domain services -->
  <g>
    <rect x="40" y="250" width="250" height="84" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="165" y="276" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">Funcionário  :3002</text>
    <text x="165" y="296" text-anchor="middle" fill="#ccfbf1" font-size="10.5">CRUD funcionários · S3/MinIO</text>
    <text x="165" y="312" text-anchor="middle" fill="#ccfbf1" font-size="10.5">producer-only</text>

    <rect x="320" y="250" width="250" height="84" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="445" y="276" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">Férias  :3003</text>
    <text x="445" y="296" text-anchor="middle" fill="#ccfbf1" font-size="10.5">solicitação · aprovação</text>
    <text x="445" y="312" text-anchor="middle" fill="#ccfbf1" font-size="10.5">publica + consome</text>

    <rect x="600" y="250" width="250" height="84" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="725" y="276" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">Avaliação  :3005</text>
    <text x="725" y="296" text-anchor="middle" fill="#ccfbf1" font-size="10.5">ciclos de avaliação</text>
    <text x="725" y="312" text-anchor="middle" fill="#ccfbf1" font-size="10.5">publica + consome</text>

    <rect x="880" y="250" width="280" height="84" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="1020" y="276" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">Folha de Pagamento  :3004</text>
    <text x="1020" y="296" text-anchor="middle" fill="#ccfbf1" font-size="10.5">cálculo de folha</text>
    <text x="1020" y="312" text-anchor="middle" fill="#ccfbf1" font-size="10.5">consome + publica</text>
  </g>

  <!-- gateway -> services (fan-out) -->
  <path class="edge" d="M340,170 C300,210 230,215 180,246" marker-end="url(#arrow)"/>
  <path class="edge" d="M360,170 C400,210 430,215 445,246" marker-end="url(#arrow)"/>
  <path class="edge" d="M380,170 C560,205 660,215 715,246" marker-end="url(#arrow)"/>
  <path class="edge" d="M400,170 C720,200 940,210 1010,246" marker-end="url(#arrow)"/>

  <!-- Mongo per service -->
  <g fill="#16a34a" stroke="#15803d">
    <rect x="90" y="372" width="150" height="40" rx="20"/>
    <rect x="370" y="372" width="150" height="40" rx="20"/>
    <rect x="650" y="372" width="150" height="40" rx="20"/>
    <rect x="945" y="372" width="150" height="40" rx="20"/>
  </g>
  <g fill="#fff" font-size="10.5" text-anchor="middle" font-weight="600">
    <text x="165" y="397">MongoDB · hr-funcionarios</text>
    <text x="445" y="397">MongoDB · hr-ferias</text>
    <text x="725" y="397">MongoDB · hr-avaliacao</text>
    <text x="1020" y="397">MongoDB · hr-folha-pagamento</text>
  </g>
  <g class="edge" marker-end="url(#arrow)">
    <path d="M165,334 L165,370"/>
    <path d="M445,334 L445,370"/>
    <path d="M725,334 L725,370"/>
    <path d="M1020,334 L1020,370"/>
  </g>
  <text x="600" y="430" text-anchor="middle" class="sub">Banco é a fonte da verdade — persiste primeiro, publica o evento depois (driver nativo mongodb, sem ORM)</text>

  <!-- Kafka bus -->
  <rect x="40" y="470" width="1120" height="92" rx="12" fill="#1e1b4b" stroke="#4c1d95"/>
  <text x="600" y="498" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Apache Kafka — Event Bus  ·  modo KRaft (sem Zookeeper)  ·  broker :19092  ·  Kafka UI :8090</text>
  <g font-size="10.5" fill="#ddd6fe" text-anchor="middle">
    <text x="600" y="522">Tópicos: hr.funcionario.* · hr.ferias.* · hr.avaliacao.* · hr.folha.* · hr.dependente.adicionado</text>
    <text x="600" y="540">Evento publicado SOMENTE após persistência · imutável · consumer-group {service}-{topic}-group · DLQ p/ consumers críticos</text>
  </g>

  <!-- service -> kafka publish -->
  <g class="edgePub" marker-end="url(#arrowPub)">
    <path d="M165,412 L165,466"/>
    <path d="M445,412 L445,466"/>
    <path d="M725,412 L725,466"/>
    <path d="M1020,412 L1020,466"/>
  </g>
  <text x="120" y="445" class="elbl">publica</text>

  <!-- Consumers (downstream / planejado) -->
  <g>
    <rect x="180" y="640" width="220" height="64" rx="10" fill="#475569" stroke="#334155"/>
    <text x="290" y="666" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Notification</text>
    <text x="290" y="686" text-anchor="middle" fill="#cbd5e1" font-size="10">e-mail / push</text>

    <rect x="490" y="640" width="220" height="64" rx="10" fill="#475569" stroke="#334155"/>
    <text x="600" y="666" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Reports</text>
    <text x="600" y="686" text-anchor="middle" fill="#cbd5e1" font-size="10">relatórios analíticos</text>

    <rect x="800" y="640" width="220" height="64" rx="10" fill="#475569" stroke="#334155"/>
    <text x="910" y="666" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Dashboard</text>
    <text x="910" y="686" text-anchor="middle" fill="#cbd5e1" font-size="10">métricas em tempo real</text>
  </g>
  <text x="1085" y="678" text-anchor="middle" class="sub">(consumers</text>
  <text x="1085" y="692" text-anchor="middle" class="sub">planejados)</text>

  <!-- kafka -> consumers -->
  <g class="edgePub" marker-end="url(#arrowPub)">
    <path d="M290,562 L290,636"/>
    <path d="M600,562 L600,636"/>
    <path d="M910,562 L910,636"/>
  </g>

  <!-- Observability footer -->
  <rect x="40" y="744" width="1120" height="46" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="60" y="772" font-size="12" font-weight="700" fill="#c2410c">Observabilidade</text>
  <text x="200" y="772" font-size="11.5" fill="#9a3412">Grafana :3001  ·  Prometheus :9090  ·  Tempo (tracing OTLP)  ·  Loki (logs estruturados JSON)  ·  /health + /metrics por serviço</text>
</svg>
